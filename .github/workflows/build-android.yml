name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.7.2 + export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          godot --headless --version

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore "$HOME/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=AYGameStudio"

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/release_keystore = "$HOME/debug.keystore"
          export/android/release_keystore_user = "androiddebugkey"
          export/android/release_keystore_pass = "android"
          EOF

      - name: Install Android build template
        run: |
          mkdir -p android/build
          unzip -o ~/.local/share/godot/export_templates/4.7.2.stable/android_source.zip -d android/build >/dev/null
          printf '4.7.2.stable' > android/.build_version

      - name: Preheat project import (best-effort)
        run: timeout 90 godot --headless --path . -e || true

      - name: Export Android APK
        run: |
          echo "HOME=$HOME"
          ls -la "$HOME/debug.keystore" || echo "KEYSTORE MISSING"
          echo "--- editor settings ---"
          cat ~/.config/godot/editor_settings-4.tres
          echo "--- preset keystore lines ---"
          grep -n keystore export_presets.cfg
          mkdir -p build
          godot --headless --path . --export-release "Android" build/TheLostRoute.apk
          ls -la build/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheLostRoute-APK
          path: build/TheLostRoute.apk
          if-no-files-found: error
